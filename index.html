                display: "(22) 99913-1266", 
                image: "denis.png",
                fallback: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?fit=crop&w=200&h=200"

            { 
                name: "Bruno Assis", 
                phone: "21988761524", 
                display: "(21) 98876-1524", 
                image: "bruno.png",
                fallback: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?fit=crop&w=200&h=200"

            {

            }

        const PLANS = [
            {
                id: 'diamond',
                title: 'Plano Diamante',

        // --- COMPONENTES ---

        const WhatsAppButton = ({ contact, className = '' }) => (
            <a 
                href={`https://wa.me/55${contact.phone}?text=Olá ${contact.name}, gostaria de saber mais sobre o patrocínio do Palavra do Dia 2026.`}

                            <span className="text-[#fbbf24]/50 text-xs mt-2">Contracapa</span>
                        </div>
                    </div>
                );
            }

                    <div className="flex shadow-2xl">

                            {/* Anuncio 1 */}
                            <div className="w-full h-[48%] bg-[#fbbf24]/10 border-2 border-dashed border-[#fbbf24] flex items-center justify-center">

                            </div>

                                <li className="flex items-center gap-2"><Check size={12} className="text-[#fbbf24]" /> Alcance Multiplataforma</li>
                                <li className="flex items-center gap-2"><Check size={12} className="text-[#fbbf24]" /> Engajamento Diário</li>
                            </ul>
                        </motion.div>

                                    <a

                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="inline-flex items-center gap-2 text-white border border-white/30 px-6 py-3 rounded-full hover:bg-white hover:text-[#0f172a] transition-all"
                                    >
                                        <Instagram size={18} /> Ver no Instagram
                                    </a>
                                </div>
                            </div>
                            <div className="lg:w-1/2 w-full flex justify-center">
                                <div className="relative rounded-2xl overflow-hidden shadow-2xl border-4 border-white/10 w-full max-w-[350px] aspect-[9/16] bg-black">
                                    <iframe 
                                        width="100%" 
                                        height="100%" 
                                        src="https://www.instagram.com/reel/DRRqCqRDrZX/embed" 
                                        title="Palavra do Dia - Pr. Fred Reis" 
                                        frameBorder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                        allowFullScreen
                                        className="absolute inset-0 w-full h-full"
                                    ></iframe>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const PlanVideoSection = () => {
            return (
                <section className="py-16 px-4 bg-slate-50 border-b border-gray-200">
                    <div className="container mx-auto max-w-4xl text-center">
                        <span className="inline-flex items-center gap-2 text-navy font-bold tracking-widest text-xs uppercase mb-4 bg-gold/20 px-3 py-1 rounded-full">
                            <Layout size={14} /> Detalhes Técnicos
                        </span>
                        <h2 className="text-2xl md:text-3xl font-serif font-bold text-navy mb-8">Entenda a Distribuição dos Espaços</h2>
                        <p className="text-lg text-slate-600 mb-8 max-w-2xl mx-auto">
                            Confira neste vídeo exclusivo a explicação detalhada dos layouts para os planos <strong>Diamante, Ouro e Prata</strong>, incluindo medidas e posicionamento.
                        </p>
                        
                        {/* Player ajustado para Vertical (9:16) */}
                        <div className="relative rounded-2xl overflow-hidden shadow-xl bg-black border border-slate-200 aspect-[9/16] flex items-center justify-center group max-w-sm mx-auto">
                            <video 
                                controls 
                                className="w-full h-full object-cover"
                                poster="capa-livro.png" 
                            >
                                <source src="video-planos.mp4" type="video/mp4" />
                                Seu navegador não suporta a tag de vídeo.
                            </video>
                        </div>
                        <p className="text-sm text-slate-500 mt-4 italic">
                            *Demonstração da contracapa (Diamante), meias páginas (Ouro) e divisão de rodapé (Prata).
                        </p>
                    </div>
                </section>
            );
        };

        const PastorVoiceSection = () => {
            const [currentIndex, setCurrentIndex] = useState(0);

            const nextQuote = () => {
                setCurrentIndex((prev) => (prev + 1) % PASTOR_QUOTES.length);
            };

            const prevQuote = () => {
                setCurrentIndex((prev) => (prev - 1 + PASTOR_QUOTES.length) % PASTOR_QUOTES.length);
            };

            useEffect(() => {
                const timer = setInterval(nextQuote, 10000); 
                return () => clearInterval(timer);
            }, []);

            return (
                <section className="py-12 px-4 bg-white border-b border-gray-100">
                    <div className="container mx-auto max-w-4xl">
                        <div className="w-full relative">
                            <div className="flex justify-end gap-2 mb-4">
                                <button onClick={prevQuote} className="p-2 rounded-full bg-slate-50 hover:bg-slate-100 text-[#0f172a] transition-colors"><ArrowLeft size={20} /></button>
                                <button onClick={nextQuote} className="p-2 rounded-full bg-slate-50 hover:bg-slate-100 text-[#0f172a] transition-colors"><ArrowRight size={20} /></button>
                            </div>

                            <div className="bg-[#fffaf5] rounded-3xl p-8 md:p-16 shadow-lg border border-[#fbbf24]/20 relative min-h-[320px] flex items-center justify-center text-center">
                                <Quote size={80} className="absolute top-6 left-6 text-[#fbbf24]/10" />
                                <Quote size={80} className="absolute bottom-6 right-6 text-[#fbbf24]/10 transform rotate-180" />
                                
                                <AnimatePresence mode="wait">
                                    <motion.div
                                        key={currentIndex}
                                        initial={{ opacity: 0, y: 10 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, y: -10 }}
                                        transition={{ duration: 0.5 }}
                                        className="relative z-10 w-full max-w-2xl mx-auto"
                                    >
                                        <span className="inline-block text-[#fbbf24] font-bold text-xs uppercase tracking-widest mb-6 border-b border-[#fbbf24] pb-1">
                                            {PASTOR_QUOTES[currentIndex].theme}
                                        </span>
                                        <p className="text-2xl md:text-3xl font-serif text-[#0f172a] leading-relaxed italic mb-8">
                                            "{PASTOR_QUOTES[currentIndex].text}"
                                        </p>
                                        <div className="flex flex-col items-center justify-center">
                                            <span className="font-bold text-[#0f172a] text-lg">Pr. Frederico Reis</span>
                                            <span className="text-xs text-slate-400 font-medium uppercase tracking-wide mt-1">
                                                Palavra do Dia
                                            </span>
                                        </div>
                                    </motion.div>
                                </AnimatePresence>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const PlanSection = ({ plan, align = 'left' }) => {
            return (
                <motion.div 
                    className={`flex flex-col md:flex-row items-center gap-8 md:gap-16 py-16 border-b border-gray-100 last:border-0 ${align === 'right' ? 'md:flex-row-reverse' : ''}`}
                    initial={{ opacity: 0, y: 50 }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true }}
                    transition={{ duration: 0.6 }}
                >
                    <div className="flex-1 flex justify-center items-center bg-white p-8 rounded-2xl w-full shadow-[0_10px_40px_-10px_rgba(0,0,0,0.05)] border border-slate-100">
                        <BookMockup type={plan.visualType} />
                    </div>
                    <div className="flex-1 text-center md:text-left">
                        <div className="flex flex-col md:flex-row items-center md:justify-between gap-3 mb-4">
                            <h3 className="text-3xl font-serif font-bold text-[#0f172a]">{plan.title}</h3>
                            <span className="bg-[#0f172a] text-[#fbbf24] px-4 py-1.5 rounded-full text-sm font-bold shadow-lg shadow-[#0f172a]/20">{plan.price}</span>
                        </div>
                        <p className="text-[#fbbf24] font-bold uppercase tracking-wider text-sm mb-4 flex items-center justify-center md:justify-start gap-2">
                            {plan.id === 'diamond' && <Star size={16} fill="currentColor"/>}
                            {plan.subtitle}
                        </p>
                        <div className="relative p-6 bg-slate-50 rounded-xl mb-8 border-l-4 border-[#fbbf24]">
                            <Quote size={24} className="text-[#fbbf24]/20 absolute top-2 right-2" />
                            <p className="text-lg text-slate-700 italic font-serif leading-relaxed">"{plan.description}"</p>
                        </div>
                        
                        <ul className="space-y-3 mb-8">
                            {plan.features.map((feature, idx) => (
                                <li key={idx} className="flex items-center justify-center md:justify-start gap-2 text-slate-600">
                                    <div className="w-5 h-5 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
                                        <Check size={12} className="text-green-600" />
                                    </div>
                                    {feature}
                                </li>
                            ))}
                        </ul>
                        
                        <div className="text-sm text-slate-500 border-t border-dashed border-slate-200 pt-4 mt-4">
                            <strong className="text-[#0f172a]">Destaque:</strong> {plan.details}
                        </div>
                    </div>
                </motion.div>
            );
        };

        const ComparisonTable = () => (
            <section className="py-20 px-4 bg-[#0f172a] text-white relative">
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                <div className="container mx-auto max-w-6xl relative z-10">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-serif font-bold mb-4">Resumo dos Investimentos</h2>
                        <p className="text-slate-400">Escolha o nível de impacto ideal para sua marca.</p>
                    </div>
                    
                    <div className="overflow-x-auto bg-white rounded-xl shadow-2xl">
                        <table className="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr className="bg-slate-100 text-[#0f172a]">
                                    <th className="p-6 font-serif font-bold text-sm uppercase tracking-wider">Plano</th>
                                    <th className="p-6 font-serif font-bold text-sm uppercase tracking-wider">Investimento</th>
                                    <th className="p-6 font-serif font-bold text-sm uppercase tracking-wider">Livros Bônus</th>
                                    <th className="p-6 font-serif font-bold text-sm uppercase tracking-wider">Visibilidade Principal (Físico)</th>
                                    <th className="p-6 font-serif font-bold text-sm uppercase tracking-wider flex items-center gap-2"><Wifi size={16}/> Visibilidade Online</th>
                                </tr>
                            </thead>
                            <tbody className="text-slate-700 divide-y divide-gray-100">
                                <tr className="hover:bg-blue-50 transition-colors">
                                    <td className="p-6 font-bold flex items-center gap-2 text-[#0f172a]"><Star size={18} className="text-blue-500" fill="currentColor"/> Diamante</td>
                                    <td className="p-6 font-bold text-[#0f172a]">R$ 5.000</td>
                                    <td className="p-6">160 un.</td>
                                    <td className="p-6 font-medium text-sm">Capa de Trás<br/><span className="text-xs text-slate-500 font-normal">(Contracapa Exclusiva)</span></td>
                                    <td className="p-6 text-sm">Destaque Solo em Vídeo + Banner Rotativo App</td>
                                </tr>
                                <tr className="hover:bg-amber-50 transition-colors">
                                    <td className="p-6 font-bold flex items-center gap-2 text-[#0f172a]"><Star size={18} className="text-yellow-500" fill="currentColor"/> Ouro</td>
                                    <td className="p-6 font-bold text-[#0f172a]">R$ 2.500</td>
                                    <td className="p-6">80 un.</td>
                                    <td className="p-6 font-medium text-sm">Verso da Capa da Frente e<br/>Verso da Capa de Trás</td>
                                    <td className="p-6 text-sm">Logo nos Créditos dos Vídeos + Banner App</td>
                                </tr>
                                <tr className="hover:bg-gray-50 transition-colors">
                                    <td className="p-6 font-bold flex items-center gap-2 text-[#0f172a]"><Star size={18} className="text-gray-400" fill="currentColor"/> Prata</td>
                                    <td className="p-6 font-bold text-[#0f172a]">R$ 1.000</td>
                                    <td className="p-6">40 un.</td>
                                    <td className="p-6 font-medium text-sm">Anúncio (Arte Completa)<br/><span className="text-xs text-slate-500 font-normal">11cm x 5cm (Jan, Abr, Ago)</span></td>
                                    <td className="p-6 text-sm">Link na Descrição (nos meses vigentes)</td>
                                </tr>
                                <tr className="hover:bg-orange-50 transition-colors">
                                    <td className="p-6 font-bold flex items-center gap-2 text-[#0f172a]"><Star size={18} className="text-orange-600" fill="currentColor"/> Bronze</td>
                                    <td className="p-6 font-bold text-[#0f172a]">R$ 300</td>
                                    <td className="p-6">10 un.</td>
                                    <td className="p-6 font-medium text-sm">Lista de Apoio</td>
                                    <td className="p-6 text-sm">Nome na Lista do Site/App</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        );

        const ContactSection = () => (
            <section className="py-24 px-4 bg-white" id="contato">
                <div className="container mx-auto max-w-5xl text-center">
                    <span className="text-[#fbbf24] font-bold tracking-widest text-xs uppercase mb-4 block">Fale Conosco</span>
                    <h2 className="text-4xl md:text-5xl font-serif font-bold text-[#0f172a] mb-6">Garanta seu espaço</h2>
                    <p className="text-xl text-slate-600 mb-16 max-w-2xl mx-auto font-light">As vagas são limitadas, especialmente para os planos Diamante e Ouro. Escolha seu consultor abaixo e inicie a conversa.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        {CONTACTS.map((contact, idx) => (
                            <motion.div 
                                key={idx} 
                                className="flex flex-col gap-4 group"
                                initial={{ opacity: 0, y: 20 }}
                                whileInView={{ opacity: 1, y: 0 }}
                                viewport={{ once: true }}
                                transition={{ delay: idx * 0.1 }}
                            >
                                <div className="bg-white p-8 rounded-2xl border border-slate-100 shadow-lg hover:shadow-2xl transition-all duration-300 flex-grow flex flex-col items-center justify-center relative overflow-hidden group-hover:-translate-y-2">
                                    <div className="absolute top-0 w-full h-1 bg-gradient-to-r from-[#0f172a] via-[#fbbf24] to-[#0f172a] opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                    
                                    <div className="w-28 h-28 bg-slate-50 text-[#0f172a] rounded-full flex items-center justify-center mb-6 border-4 border-slate-100 group-hover:border-[#fbbf24] transition-colors overflow-hidden relative shadow-lg">
                                        <img 
                                            src={contact.image} 
                                            alt={contact.name} 
                                            className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500"
                                            onError={(e) => {
                                                // Se a imagem local falhar, usa o fallback do objeto CONTACTS
                                                e.target.src = contact.fallback;
                                            }}
                                        />
                                    </div>

                                    <h3 className="font-serif font-bold text-xl text-[#0f172a] mb-1">{contact.name}</h3>
                                    <p className="text-[#fbbf24] text-xs font-bold uppercase tracking-wider mb-6">Consultor Comercial</p>
                                    
                                    <div className="w-full mt-auto">
                                         <p className="font-mono text-slate-500 mb-4 text-sm flex items-center justify-center gap-2">
                                            <Phone size={14} /> {contact.display}
                                        </p>
                                        <WhatsAppButton contact={contact} className="w-full transform group-hover:scale-105 transition-transform" />
                                    </div>
                                </div>
                            </motion.div>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="bg-[#0f172a] text-white/60 py-12 text-center border-t border-white/10">
                <div className="container mx-auto px-4">
                    <div className="flex flex-col items-center justify-center mb-8">
                        {/* Container para a Logo */}
                        <div className="relative h-24 w-auto mb-4 flex items-center justify-center opacity-80 hover:opacity-100 transition-opacity">
                            <img 
                                src="logo-ibm.png" 
                                alt="Igreja Batista Memorial de Macaé" 
                                className="h-full w-auto object-contain brightness-0 invert"
                                onError={(e) => {
                                    e.target.style.display = 'none';
                                    const fallback = document.getElementById('fallback-text');
                                    if(fallback) fallback.style.display = 'block';
                                }}
                            />
                            {/* Fallback de Texto */}
                            <div id="fallback-text" style={{display: 'none'}} className="font-serif font-bold text-2xl text-white tracking-widest uppercase">
                                IBM Macaé
                            </div>
                        </div>
                    </div>
                    <p className="text-sm leading-loose">
                        &copy; 2026 <strong>Palavra do Dia</strong>. Todos os direitos reservados. <br/>
                        Um projeto da <span className="text-white">Igreja Batista Memorial de Macaé</span>.
                    </p>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen font-sans bg-[#fffaf5] text-[#0f172a]">
                    <Hero />
                    <Intro />
                    <EcosystemSection />
                    <FeaturedMessage />
                    <PastorVoiceSection />
                    
                    <div className="container mx-auto px-4 max-w-6xl py-12" id="planos">
                        <div className="text-center mb-16">
                            <span className="text-[#fbbf24] font-bold tracking-widest text-xs uppercase mb-3 block">Nossos Planos</span>
                            <h2 className="text-3xl md:text-4xl font-serif font-bold text-[#0f172a]">Opções de Patrocínio</h2>
                        </div>
                        {PLANS.map((plan, index) => (
                            <PlanSection 
                                key={plan.id} 
                                plan={plan} 
                                align={index % 2 !== 0 ? 'right' : 'left'} 
                            />
                        ))}
                    </div>

                    {/* Vídeo movido para depois dos planos conforme solicitado */}
                    <PlanVideoSection />
                    
                    <ComparisonTable />
                    <ContactSection />
                    <Footer />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
